name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download self-hosted fonts
        run: bash scripts/get-fonts.sh
      - name: Prepare site folder
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets data _site/
          if [ -d audio ]; then cp -r audio _site/; fi
      - name: Build WordPress plugin zip (with fonts)
        run: bash scripts/build-wp-plugin.sh
      - name: Keep the WordPress zip as a download
        uses: actions/upload-artifact@v4
        with:
          name: wortzi-wp
          path: dist/wortzi-wp.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
