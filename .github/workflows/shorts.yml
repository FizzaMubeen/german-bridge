name: Make 30-day shorts videos
# Run it from the Actions tab → "Make 30-day shorts videos" → Run workflow.
# When it finishes, download "shorts" from the run's Artifacts: 30 videos, covers, captions and a posting calendar.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First posting date (YYYY-MM-DD). Empty = next Monday"
        required: false
        default: ""
      days:
        description: "How many videos"
        required: false
        default: "30"
permissions:
  contents: read
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core
          bash scripts/get-fonts.sh
      - name: Install free voices (Piper) and browser
        run: |
          pip install -q "piper-tts==1.3.0" playwright
          python -m playwright install --with-deps chromium
      - name: Make the videos
        run: |
          ARGS="--days ${{ github.event.inputs.days || '30' }}"
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          python scripts/shorts/make_shorts.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            out/shorts/*.mp4
            out/shorts/*.png
            out/shorts/calendar.csv
            out/shorts/captions.md
          retention-days: 30
