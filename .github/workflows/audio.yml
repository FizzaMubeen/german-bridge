name: Make audio
# Makes natural German audio (free Piper voice) for every card, story line and grammar example.
# Runs by itself when cards, stories or the app change; only new or changed texts are recorded.
on:
  push:
    branches: [main]
    paths: ["data/**", "assets/js/app.js", "scripts/make-audio.py"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and the Piper voice engine
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q "piper-tts==1.3.0"
      - name: Record new texts
        timeout-minutes: 45
        run: python scripts/make-audio.py
      - name: Save the audio and publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "No new audio."; exit 0; fi
          git config user.name "wortzi-audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audio: record new and changed texts"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
