<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortzi</title>
<meta name="description" content="Learn everyday German from Urdu, Hindi or English. Flashcards with pictures, your own word lists, progress tracking and printable PDF reports. Private: your data stays on your device.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a201f" media="(prefers-color-scheme: dark)">
<!-- Privacy: the app only talks to its own files. No trackers, no ads, no outside fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortzi">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<!--APP-->
<header class="top pad">
  <div class="inner">
    <a class="brand" href="#today"><img src="assets/icons/icon-192.png" alt="" width="30" height="30">Wortzi</a>
    <nav class="tabs" aria-label="Main">
      <a href="#today" data-nav="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
      <a href="#learn" data-nav="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="16" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>Learn</a>
      <a href="#words" data-nav="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>My words<span class="count" id="wantCount" hidden></span></a>
      <a href="#listen" data-nav="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>Listen</a>
      <a href="#me" data-nav="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</a>
    </nav>
    <div class="stats" id="stats"></div>
  </div>
</header>
<main class="pad"><div class="inner" id="app"><p class="muted">Loading…</p></div></main>
<canvas id="confetti" hidden></canvas>
<noscript><p style="padding:20px">Wortzi needs JavaScript to run.</p></noscript>
<script src="assets/js/app.js" defer></script>
<!--/APP-->
</body>
</html>
